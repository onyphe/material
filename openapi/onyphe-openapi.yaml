openapi: 3.0.3
info:
  title: ONYPHE API - Search, Export, Discovery and ASD Pivot Query
  version: "2026-10-21"
  description: |
    Developer reference for four ONYPHE endpoints: **Search**, **Export**,
    **Discovery** (bulk) and **ASD Pivot Query**. Queries are written in OQL
    (ONYPHE Query Language), always `FILTER:VALUE`.

    ## Two use cases, two data models

    The `category` you query decides which **field names** you must use.
    A field from the wrong model **returns 0 results (or HTTP 400) and never
    an explicit "unknown field" error**, which is indistinguishable from a
    genuine absence. Pick the model first.

    ### A. IP enrichment and CTI: `ctiscan` and `ctiurl` (ctiscan data model)

    - `ctiscan` is service-level: one document per scanned service, merging
      every scanning step (IP, TCP, application, TLS/certificate, component,
      DNS, HTTP, favicon, hashes...) so a single document carries every pivot.
    - `ctiurl` is URL-level and uses the same model; `http.url` is what
      distinguishes it.
    - Fields are organised in *layers* (`ip.*`, `tcp.*`, `app.*`, `http.*`,
      `cert.*`, `component.*`, `dns.*`, `html.*`, ...).
    - The raw response is `app.data.text` (up to ~1 MB).
    - Use it to enrich an IP (`ip.dest:1.2.3.4`), hunt infrastructure, and pivot
      on certificates, hashes and fingerprints.
    - The Summary API never returns ctiscan/ctiurl; query them here.

    ### B. Attack surface management (ASM): `riskscan` and `vulnscan` (datascan data model)

    - `datascan`, `vulnscan` and `riskscan` share one flat, datascan-style model
      (`ip`, `port`, `protocol`, `hostname`, `domain`, `tag`, `cve`, `cpe`,
      `seen_date`, `data`...).
    - `riskscan`: services matching a CTI-informed risk baseline, carrying
      `risk::*` tags (exposed database, critical CVE, sensitive protocol,
      compromised device...) and the positive CVE detections. About **7 months**
      of history. Positive-only: it has no "not vulnerable" verdicts. Its raw
      `data` is truncated after a period of time.
    - `vulnscan`: CVE detection by *check-based* (`vulnerable`, `notvulnerable`,
      `maybevulnerable`, `unknownvulnerable`) and *version-based*
      (`vulnerableversion`, `notvulnerableversion`, `maybevulnerableversion`,
      `partialversion`, `unknownversion`, `version`) detection. Holds negative
      verdicts, the full stored response and deeper history. Always add
      `-exists:cve` when you want only records that carry a CVE.
    - Typical entry point is the **Discovery** endpoint, fed with an asset
      inventory (one OQL line per domain/IP).

    ### Field dialect cheat-sheet

    | Meaning | datascan / vulnscan / riskscan | ctiscan / ctiurl |
    |---|---|---|
    | IP | `ip` | `ip.dest` |
    | Port | `port` | `tcp.dest` (this service), `services.port` (any open port on the host) |
    | Protocol | `protocol` | `app.protocol` |
    | Raw response | `data` (capped at 16384 bytes) | `app.data.text` (up to ~1 MB) |
    | CPE | `cpe` | `component.cpe` |
    | Product / vendor / version | `product`, `productvendor`, `productversion` | `component.product`, `component.vendor`, `component.version` |
    | HTTP status | `status` | `http.code` |
    | URL | `url` | `http.url` |
    | Page title | `app.http.title` | `html.title.text` (full-text), `html.title.raw` (exact/regexp) |
    | Device class | `device.class` | `app.device` |
    | Reverse / forward DNS | `reverse` / `forward` | `dns.reverse.hostname` / `dns.forward.hostname` |
    | ASN / organisation / country | `asn`, `organization`, `country` | `ip.asn`, `ip.organization`, `ip.country` |
    | Cert subject CN / issuer org | `subject.commonname`, `issuer.organization` | `cert.subject.cn`, `cert.issuer.o` |
    | Cert SHA-256 | `fingerprint.sha256` | `cert.fingerprint.sha256` |

    Unchanged in both models: `tag`, `source`, `@category`, `@timestamp`,
    `seen_date`.

    ## OQL notes

    Plain filters are `FILTER:VALUE`. OR is `?`, NOT is `!`; there is no
    `OR`/`NOT` keyword: `( ?domain:a.com ?domain:b.com )`, `!domain:google.com`.

    **Functions** are server-side, prefixed with `-`, written on the query
    side (before any `|` post-processing). Every function has a short alias.
    They are licence-gated: one your subscription does not grant is refused
    (`400 unknown function`), not ignored.

    | Function | Alias | Meaning |
    |---|---|---|
    | `-wildcard:<field>,<wildcard_filter>` | `-wd:` | Wildcard match, `?` = one char, `*` = zero or more. e.g. `-wildcard:subject.organization,"*legrand*"` |
    | `-orwildcard:<field>,<wildcard_filter>` | `-owd:` | Repeatable, OR-combined |
    | `-notwildcard:<field>,<wildcard_filter>` | `-nwd:` | Exclusion |
    | `-regexp:<field>,"<regexp>"` | `-re:` | Regular expression, anchored and case-insensitive: wrap in `.*` for a substring |
    | `-orregexp:<field>,"<regexp>"` | `-ore:` | Repeatable, OR-combined |
    | `-notregexp:<field>,"<regexp>"` | `-nre:` | Exclusion |
    | `-exists:<field>` | `-ex:` | Field is populated, e.g. `-exists:cve` |
    | `-notexists:<field>` | `-nex:` | Field is absent |
    | `-orexists:<field>` | `-oex:` | Repeatable, OR-combined |
    | `-since:<period>` | `-si:` | Rolling window: `7d`, `1w`, `3M`, `7M` |
    | `-hourago:N`, `-dayago:N`, `-weekago:N`, `-monthago:N` | `-ha:`, `-da:`, `-wa:`, `-ma:` | A whole bucket N units back (`-dayago:1` is all of yesterday, not the last 24 hours); `0` is the current one |
    | `-fields:<f1>,<f2>,...` | `-fi:` | Server-side projection. Use it everywhere; mandatory in practice for Export |
    | `-sort:0` | `-so:` | Oldest first (default is newest first) |

    - Wildcard and regexp match the **whole value** of a keyword field
      (case-insensitive). On a `text` field they match **individual tokens**:
      `-wildcard:html.title.text,"*ound"` matches "404 Not Found", but a
      pattern spanning a space (`"404 not*"`) never matches and does not
      error. Use the keyword variant (e.g. `html.title.raw`) for whole values.
    - Wildcard and regexp are I/O-intensive and may time out: a timeout is
      not a zero.
    - Examples:
      `category:datascan -wildcard:domain,g??gle.com !domain:google.com`,
      `category:ctl -regexp:domain,"g[^\\.o]ogle[a-z0-9-]*\\.[a-z\\.]{1,}" -since:1w`,
      `category:datascan -wildcard:subject.organization,"*legrand*" tag:cert::valid`.
    - If no historical function is given, Search covers the last 30 days.

    ## Interpreting results

    - **An empty result is not an error.** "Not scanned", "outside the
      window", "wrong field model" and "genuinely absent" all return 0
      results with `error: 0`.
    - A document is one scan, not one asset: the same `ip:port` can appear
      several times in a window.
    - ONYPHE data is passive observation: it tells you what was seen and
      when, not the current state of an asset.

    ## Authentication

    API key. Two schemes:

    - `bearerAuth` (`Authorization: Bearer <key>`, scheme name
      case-insensitive) for the v2 API (Search, Export, Discovery).
    - `apiKeyAuth` (`X-Api-Key: <key>`) for the ASD v1 API, served from its
      own base URL (`https://www.onyphe.io/api/v1`) with the same key, Griffin
      View only.

    Authentication failures are returned as HTTP 400 with an error code
    (v2: `error` 2 for a missing key, 14 for an unknown key or exhausted
    credit; ASD: `error` 1002 for a missing key, 1003 "user not found" for
    an unknown one).

    ## Errors

    Errors are HTTP 400 with a JSON body; read `error` (0 on success) and
    `text`. The v2 body is `{count, error, myip, status: "nok", text, took,
    total}`; the ASD body is `{error, text}`. Codes observed on v2:

    | `error` | Meaning |
    |---|---|
    | 2 | No API key given |
    | 6 | Invalid parameter given (e.g. `size` outside 1..10000) |
    | 12 | OQL rejected: syntax error, unknown function, or a field/category your licence does not include (`access denied: index not allowed: <category>`, `access denied: filter not allowed: <field>`) |
    | 13 | API access denied: the endpoint (Export, Discovery, or a Discovery category) is not in your licence |
    | 14 | No more credit, or unknown API key |
    | 22 | API endpoint not found |

    ASD codes are listed under the `Error` schema.

    ## Rate limit

    About 1 request per second; excess returns HTTP 429.
  contact:
    name: ONYPHE
    url: https://www.onyphe.io
  license:
    name: BSD-3-Clause
